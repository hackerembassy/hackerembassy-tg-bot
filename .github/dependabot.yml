version: 2
# PR limits add up to 5 open PRs at a time
updates:
    # Major versions are breaking, upgrade them by hand
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 3
      ignore:
          - dependency-name: "*"
            update-types: [version-update:semver-major]
      groups:
          production:
              dependency-type: production
              update-types: [minor, patch]
          development:
              dependency-type: development
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 1
      ignore:
          - dependency-name: "*"
            update-types: [version-update:semver-major]
      groups:
          actions:
              patterns: ["*"]

    # Node major (LTS) bumps are done by hand together with .nvmrc
    - package-ecosystem: docker
      directory: /deploy
      schedule:
          interval: weekly
      open-pull-requests-limit: 1
      ignore:
          - dependency-name: node
            update-types: [version-update:semver-major]
